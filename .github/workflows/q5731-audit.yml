name: Q5731 exact first-digit audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'q5731_cartier_first_digit_audit.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Run exact dependency-free scan
        shell: bash
        run: |
          set +e
          python3 q5731_cartier_first_digit_audit.py 2>&1 | tee q5731-audit.out
          status=${PIPESTATUS[0]}
          echo "$status" | tee q5731-audit.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: q5731-audit
          path: |
            q5731-audit.out
            q5731-audit.status
