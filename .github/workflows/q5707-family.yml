name: q5707-family

on:
  pull_request:
    branches: [main]
    paths:
      - 'q5707-trigger.txt'

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install factorizer
        run: python3 -m pip install --quiet sympy
      - name: Run cover-preserving adjacent-stencil family
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/q5707-compute.yml').read_text()
          s=s.split("cat > /tmp/q5707.py <<'PY'\n",1)[1].split("\n          PY",1)[0]
          s='\n'.join(line[10:] if line.startswith('          ') else line for line in s.splitlines())
          s=s.rsplit('selftest(); row(321)',1)[0]
          Path('/tmp/q5707_base.py').write_text(s+'\n')
          PY
          cat >> /tmp/q5707_base.py <<'PY'
          from functools import reduce

          def carrier(vals, start, dmin, L):
              ws=[(-1)**i*B(start+i,i)*B(start+L+1,L-i) for i in range(L+1)]
              assert sum(ws)==1
              return sum(ws[i]*vals[start+i-dmin] for i in range(L+1))

          def family(n):
              M=n-1; d0=M//2+1; dmin=d0-1; dmax=d0+51
              CL=[]; CP=[]
              for d in range(dmin,dmax+1):
                  CL.append(shell_lambda(M,d)); CP.append(shell_phi(M,d))
              specs=[(d0,50),(d0,51),(d0-1,51)]
              GL=[carrier(CL,s,dmin,L) for s,L in specs]
              GP=[carrier(CP,s,dmin,L) for s,L in specs]
              DD=[a-b for a,b in zip(GL,GP)]
              gall=reduce(gcd,[abs(x) for x in GL+GP])
              gladj=reduce(gcd,[abs(x) for x in GL])
              gpadj=reduce(gcd,[abs(x) for x in GP])
              gdadj=reduce(gcd,[abs(x) for x in DD])
              b=apery(M); ps=set(primes(n)); cand=[d+1 for d in range(d0,d0+51) if d+1 in ps]
              targets=[p for p in cand if b[n-p]%p==0]; P=prod(cand); R=prod(targets)
              print('FAMILY_ROW',n,'M',M,'SPECS',specs)
              print('CAND',cand,'TARGETS',targets,'P',P,'R',R)
              print('GL',GL); print('GP',GP); print('D',DD)
              print('G_LAMBDA_ADJ',gladj,'FACTOR',factorint(gladj))
              print('G_PHI_ADJ',gpadj,'FACTOR',factorint(gpadj))
              print('G_ALL_SIX',gall,'FACTOR',factorint(gall),'HEIGHT',height(gall))
              print('G_D_ADJ',gdadj,'FACTOR',factorint(gdadj),'GCD_WITH_P',gcd(gdadj,P))

          selftest()
          for n in [200,272,300,321,755]: family(n)
          PY
          python3 /tmp/q5707_base.py
