name: Q10130 robust linear species numerics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q10130-numerics-temp.yml'

jobs:
  cells:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        k: [1, 2, 3]
        ei: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy scipy
      - run: curl -fsSL https://raw.githubusercontent.com/xiangyazi24/SSExactMajority/scratch/q10130/run.py -o /tmp/run.py
      - run: |
          mkdir -p result
          python /tmp/run.py cell '${{ matrix.k }}' '${{ matrix.ei }}' 'result/cell-${{ matrix.k }}-${{ matrix.ei }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: cell-${{ matrix.k }}-${{ matrix.ei }}
          path: result/cell-${{ matrix.k }}-${{ matrix.ei }}.json
          retention-days: 2

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy scipy
      - run: curl -fsSL https://raw.githubusercontent.com/xiangyazi24/SSExactMajority/scratch/q10130/run.py -o /tmp/run.py
      - run: |
          mkdir -p result
          python /tmp/run.py edge result/edge.json
      - uses: actions/upload-artifact@v4
        with:
          name: edge
          path: result/edge.json
          retention-days: 2

  aggregate:
    needs: [cells, edge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy
      - run: curl -fsSL https://raw.githubusercontent.com/xiangyazi24/SSExactMajority/scratch/q10130/run.py -o /tmp/run.py
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: result
          merge-multiple: true
      - run: |
          ls -l result
          test $(find result -name 'cell-*.json' | wc -l) -eq 12
          test -f result/edge.json
          python /tmp/run.py aggregate result summary.json
          cat summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: q10130-summary
          path: summary.json
          retention-days: 2
