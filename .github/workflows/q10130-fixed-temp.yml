name: Q10130 fixed aligned adversaries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q10130-fixed-temp.yml'

permissions:
  contents: write
  actions: read

jobs:
  cells:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        k: [1, 2, 3]
        ei: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy scipy
      - run: |
          curl -fsSL https://raw.githubusercontent.com/xiangyazi24/SSExactMajority/scratch/q10130/run.py -o /tmp/run.py
          curl -fsSL https://raw.githubusercontent.com/xiangyazi24/SSExactMajority/scratch/q10130/fixed.py -o /tmp/fixed.py
      - run: |
          mkdir -p result
          cd /tmp
          python fixed.py cell '${{ matrix.k }}' '${{ matrix.ei }}' "$GITHUB_WORKSPACE/result/fixed-cell-${{ matrix.k }}-${{ matrix.ei }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-cell-${{ matrix.k }}-${{ matrix.ei }}
          path: result/fixed-cell-${{ matrix.k }}-${{ matrix.ei }}.json
          retention-days: 2

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy scipy
      - run: |
          curl -fsSL https://raw.githubusercontent.com/xiangyazi24/SSExactMajority/scratch/q10130/run.py -o /tmp/run.py
          curl -fsSL https://raw.githubusercontent.com/xiangyazi24/SSExactMajority/scratch/q10130/fixed.py -o /tmp/fixed.py
      - run: |
          mkdir -p result
          cd /tmp
          python fixed.py edge "$GITHUB_WORKSPACE/result/fixed-edge.json"
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-edge
          path: result/fixed-edge.json
          retention-days: 2

  aggregate:
    needs: [cells, edge]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy scipy
      - run: |
          curl -fsSL https://raw.githubusercontent.com/xiangyazi24/SSExactMajority/scratch/q10130/run.py -o /tmp/run.py
          curl -fsSL https://raw.githubusercontent.com/xiangyazi24/SSExactMajority/scratch/q10130/fixed.py -o /tmp/fixed.py
      - uses: actions/download-artifact@v4
        with:
          pattern: 'fixed-*'
          path: result
          merge-multiple: true
      - run: |
          test $(find result -name 'fixed-cell-*.json' | wc -l) -eq 12
          test -f result/fixed-edge.json
          mkdir -p q10130
          cd /tmp
          python fixed.py aggregate "$GITHUB_WORKSPACE/result" "$GITHUB_WORKSPACE/q10130/fixed-summary.json" "$GITHUB_WORKSPACE/q10130/fixed-report.txt"
          cat "$GITHUB_WORKSPACE/q10130/fixed-report.txt"
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add q10130/fixed-summary.json q10130/fixed-report.txt
          git commit -m 'Record corrected Q10130 fixed adversaries'
          git push origin HEAD:main
